name: openhome
description: Open local client for Xiaomi smart-home devices (miIO/MIOT, no cloud).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_blue_plus: ^2.3.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/specs/
